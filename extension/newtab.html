<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Moodwall</title>
<link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="background"></div>
  <div id="scrim"></div>

  <div id="topControls">
    <button id="settingsButton" aria-label="설정" title="설정">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M14.647 4.081a.724 .724 0 0 0 1.08 .448c2.439 -1.485 5.23 1.305 3.745 3.744a.724 .724 0 0 0 .447 1.08c2.775 .673 2.775 4.62 0 5.294a.724 .724 0 0 0 -.448 1.08c1.485 2.439 -1.305 5.23 -3.744 3.745a.724 .724 0 0 0 -1.08 .447c-.673 2.775 -4.62 2.775 -5.294 0a.724 .724 0 0 0 -1.08 -.448c-2.439 1.485 -5.23 -1.305 -3.745 -3.744a.724 .724 0 0 0 -.447 -1.08c-2.775 -.673 -2.775 -4.62 0 -5.294a.724 .724 0 0 0 .448 -1.08c-1.485 -2.439 1.305 -5.23 3.744 -3.745a.722 .722 0 0 0 1.08 -.447c.673 -2.775 4.62 -2.775 5.294 0zm-2.647 4.919a3 3 0 1 0 0 6a3 3 0 0 0 0 -6" />
      </svg>
    </button>
  </div>

  <div id="settingsPanel" hidden>
    <label class="settings-row">
      <span>폰트</span>
      <select id="fontSelect" aria-label="폰트 선택">
        <option value="system">시스템 기본</option>
        <optgroup label="산세리프">
          <option value="Inter">Inter</option>
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Sora">Sora</option>
          <option value="Space Grotesk">Space Grotesk</option>
          <option value="Outfit">Outfit</option>
          <option value="Bebas Neue">Bebas Neue</option>
          <option value="Archivo Black">Archivo Black</option>
        </optgroup>
        <optgroup label="세리프">
          <option value="Playfair Display">Playfair Display</option>
          <option value="Lora">Lora</option>
          <option value="Merriweather">Merriweather</option>
          <option value="EB Garamond">EB Garamond</option>
          <option value="Noto Serif KR">Noto Serif KR</option>
          <option value="Nanum Myeongjo">Nanum Myeongjo</option>
        </optgroup>
      </select>
    </label>

    <label class="settings-row">
      <span>굵기</span>
      <select id="weightSelect" aria-label="폰트 굵기 선택">
        <option value="400">Regular</option>
        <option value="500">Medium</option>
        <option value="600">SemiBold</option>
        <option value="700">Bold</option>
        <option value="800" selected>ExtraBold</option>
        <option value="900">Black</option>
      </select>
    </label>

    <label class="settings-row">
      <span>레이아웃</span>
      <select id="layoutSelect" aria-label="레이아웃 선택">
        <option value="center">가운데</option>
        <option value="corner">코너</option>
      </select>
    </label>

    <label class="settings-row">
      <span>무드</span>
      <select id="moodSelect" aria-label="무드 선택">
        <option value="random">랜덤</option>
        <option value="calm">차분함</option>
        <option value="energetic">활기참</option>
        <option value="nature">자연</option>
        <option value="minimal">미니멀</option>
        <option value="dark">다크</option>
        <option value="cozy">포근함</option>
        <option value="ocean">바다</option>
        <option value="fall">가을</option>
        <option value="winter">겨울</option>
        <option value="italy">이탈리아</option>
        <option value="newyork">뉴욕</option>
      </select>
    </label>

    <hr />

    <label><input type="checkbox" id="toggleSeconds" /> 시계에 초 표시</label>
    <label><input type="checkbox" id="toggleQuote" /> 오늘의 한마디 표시</label>

    <hr />

    <label><input type="checkbox" id="toggleCalendar" /> 다음 일정 표시</label>
    <label><input type="checkbox" id="toggleGmail" /> 안읽은 메일 표시</label>
    <button id="googleSignInButton" hidden>Google 계정 연결</button>
    <button id="googleSignOutButton" hidden>연결 해제</button>
  </div>

  <div id="widgets">
    <section id="calendarWidget" class="info-card" hidden>
      <h3>다음 일정</h3>
      <ul id="calendarList"></ul>
    </section>
    <section id="gmailWidget" class="info-card" hidden>
      <h3>안읽은 메일 <span id="unreadCount"></span></h3>
      <ul id="gmailList"></ul>
    </section>
  </div>

  <main id="panel">
    <div id="clock">00:00:00 AM</div>
    <div id="date"></div>
    <form id="searchForm" action="https://www.google.com/search" method="GET" autocomplete="off">
      <input
        type="search"
        name="q"
        id="searchInput"
        placeholder="Google 검색"
        autocomplete="off"
        autofocus
      />
    </form>
    <div id="quote" hidden>
      <p id="quoteText"></p>
    </div>
  </main>

  <div id="bookmarksZone">
    <div id="bookmarksHint"></div>
    <nav id="bookmarks" aria-label="북마크 바로가기"></nav>
  </div>

  <div id="credit"></div>

  <script src="quotes.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
