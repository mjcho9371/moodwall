<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Moodwall</title>
<link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="background"></div>
  <div id="scrim"></div>

  <div id="topControls">
    <select id="fontSelect" aria-label="폰트 선택">
      <option value="system">시스템 기본</option>
      <option value="Inter">Inter</option>
      <option value="Poppins">Poppins</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Sora">Sora</option>
      <option value="Space Grotesk">Space Grotesk</option>
      <option value="Outfit">Outfit</option>
      <option value="Bebas Neue">Bebas Neue</option>
      <option value="Archivo Black">Archivo Black</option>
    </select>

    <select id="moodSelect" aria-label="무드 선택">
      <option value="random">랜덤</option>
      <option value="calm">차분함</option>
      <option value="energetic">활기참</option>
      <option value="nature">자연</option>
      <option value="minimal">미니멀</option>
      <option value="dark">다크</option>
      <option value="cozy">포근함</option>
      <option value="ocean">바다</option>
    </select>
  </div>

  <main id="panel">
    <div id="clock">00:00:00 AM</div>
    <div id="date"></div>
    <form id="searchForm" action="https://www.google.com/search" method="GET" autocomplete="off">
      <input
        type="search"
        name="q"
        id="searchInput"
        placeholder="Google 검색"
        autocomplete="off"
        autofocus
      />
    </form>
  </main>

  <nav id="bookmarks" aria-label="북마크 바로가기"></nav>

  <div id="credit"></div>

  <script src="newtab.js"></script>
</body>
</html>
